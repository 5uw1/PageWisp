# SonarQube Cloud (sonarcloud.io) analysis, run from .github/workflows/build.yml.
sonar.organization=5uw1
sonar.projectKey=5uw1_PageWisp
sonar.projectName=PageWisp

sonar.sources=app,main.py
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.14

# Produced by: pytest --cov=app --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml
# main.py only wires up QApplication; the tests exercise everything through app/
sonar.coverage.exclusions=main.py
